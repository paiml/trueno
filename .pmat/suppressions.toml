# CB-515: Catch-all `_ => {}` in key event handlers and HTTP header parsers
# These are intentional no-ops for unrecognized inputs, not concrete return values.
# Tracked: https://github.com/paiml/paiml-mcp-agent-toolkit/issues/207
[suppressions.CB-515]
[[suppressions.CB-515.rules]]
file = "src/bin/trueno_monitor/main.rs"
lines = [603]
reason = "Key event handler: _ => {} correctly ignores unmapped KeyCode variants"

[[suppressions.CB-515.rules]]
file = "src/brick/connection/mod.rs"
lines = [172]
reason = "HTTP header parser: _ => {} correctly ignores unknown header parameters"

