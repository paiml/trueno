name: Benchmark Regression Detection

on:
  pull_request:
    paths:
      - 'src/**'
      - 'trueno-gpu/src/**'
      - 'benches/**'
      - 'Cargo.toml'
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C target-cpu=native"

jobs:
  benchmark:
    name: Performance Regression Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install critcmp
        run: cargo install critcmp

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}

      - name: Download baseline benchmarks
        uses: actions/cache@v5
        with:
          path: target/criterion
          key: benchmark-baseline-${{ github.base_ref || 'main' }}
          restore-keys: |
            benchmark-baseline-main

      - name: Run benchmarks
        run: cargo bench --no-fail-fast -- --save-baseline current

      - name: Compare against baseline
        id: compare
        run: |
          # Check for regressions > 15%
          if critcmp baseline current --threshold 15 2>/dev/null | grep -q "regressed"; then
            echo "regression_detected=true" >> $GITHUB_OUTPUT
            echo "## Performance Regression Detected" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            critcmp baseline current --threshold 15 >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "regression_detected=false" >> $GITHUB_OUTPUT
            echo "## No Performance Regressions" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "All benchmarks within 15% of baseline." >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: "true"

      - name: Save baseline (main branch only)
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v5
        with:
          path: target/criterion
          key: benchmark-baseline-main

      - name: Fail on regression
        if: steps.compare.outputs.regression_detected == 'true'
        run: |
          echo "::error::Performance regression detected! See summary for details."
          exit 1

  hot-path-check:
    name: Hot Path Bounds Check Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for .get()/.get_mut() in hot paths
        run: |
          echo "Checking for bounds-checking methods in hot loops..."

          # Define hot path patterns (inner loops in performance-critical code)
          HOT_PATH_VIOLATIONS=""

          # Check matrix.rs convolve2d inner loop
          if grep -n "\.get\(.*,.*\)" src/matrix.rs | grep -E "for.*k_row|for.*k_col" > /dev/null 2>&1; then
            HOT_PATH_VIOLATIONS="$HOT_PATH_VIOLATIONS\n- src/matrix.rs: .get() in convolution inner loop"
          fi

          # Check for .expect()/.unwrap() in backend SIMD loops
          for f in src/backends/*.rs; do
            if grep -n "\.expect\|\.unwrap" "$f" | grep -v "// SAFETY" | grep -v "#\[" > /dev/null 2>&1; then
              # Only flag if inside a loop
              if grep -B5 "\.expect\|\.unwrap" "$f" | grep -q "for\|while"; then
                HOT_PATH_VIOLATIONS="$HOT_PATH_VIOLATIONS\n- $f: .expect()/.unwrap() potentially in hot loop"
              fi
            fi
          done

          if [ -n "$HOT_PATH_VIOLATIONS" ]; then
            echo "::warning::Potential hot path violations found:$HOT_PATH_VIOLATIONS"
          else
            echo "No hot path violations detected."
          fi
