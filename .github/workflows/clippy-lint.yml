name: Clippy Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  clippy:
    name: Clippy Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (library, all features)
        run: cargo clippy --lib --all-features -- -D warnings
      - name: Clippy (library, no default features)
        run: cargo clippy --lib --no-default-features -- -D warnings
      - name: Clippy (tests, all features)
        run: >-
          cargo clippy --tests --all-features -- -D warnings
          -A unknown-lints
          -A clippy::disallowed-methods
          -A clippy::float-cmp -A clippy::float-cmp-const
          -A clippy::approx-constant
          -A deprecated
          -A unused-doc-comments
          -A clippy::single-char-pattern
          -A clippy::manual-range-contains
          -A clippy::no-effect-underscore-binding
          -A clippy::unused-unit
          -A clippy::large-stack-arrays
          -A clippy::ref-as-ptr
          -A clippy::identity-op
          -A clippy::len-zero
          -A clippy::ignore-without-reason
          -A clippy::stable-sort-primitive
          -A clippy::manual-contains
          -A clippy::manual-midpoint
          -A clippy::needless-lifetimes
          -A clippy::map-or-transform
          -A clippy::unwrap-on-ok
          -A clippy::unnecessary-literal-unwrap
          -A clippy::unnecessary-literal-bound
          -A clippy::unnecessary-map-or
