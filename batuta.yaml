# batuta orchestration manifest for trueno
# See: docs/specifications/compute-block-tui-cbtop.md §21.2
version: "1.0"

packages:
  # Core trueno library
  - name: trueno
    type: library
    path: .
    crates:
      - trueno
    features:
      - simd
      - wgpu

  # GPU sub-crate
  - name: trueno-gpu
    type: library
    path: trueno-gpu
    depends_on:
      - trueno
    features:
      - cuda
    optional_deps:
      - libcuda.so

  # CUPTI profiling sub-crate
  - name: trueno-cupti
    type: library
    path: trueno-cupti
    depends_on:
      - trueno-gpu
    optional_deps:
      - libcupti.so

  # cbtop TUI binary
  - name: cbtop
    type: binary
    path: crates/cbtop
    depends_on:
      - trueno
      - trueno-gpu
      - trueno-cupti
      - presentar-terminal
    monitors:
      - simular
      - whisper.apr
      - realizar
    features:
      - cuda
      - wos-kernel
    notify_on_release: true

  # PTX debugging tool
  - name: trueno-ptx-debug
    type: binary
    path: trueno-ptx-debug
    depends_on:
      - trueno-gpu
    features:
      - falsify

build_order:
  - trueno
  - trueno-gpu
  - trueno-cupti
  - cbtop
  - trueno-ptx-debug

notifications:
  # ComputeBrick API change triggers full rebuild
  on_api_change:
    - pattern: "src/brick.rs"
      notify:
        - all
    - pattern: "trueno-gpu/src/kernels/*"
      notify:
        - cbtop
        - trueno-ptx-debug

  # Spec changes notify downstream
  on_spec_change:
    - pattern: "docs/specifications/compute-block-tui-cbtop.md"
      notify:
        - presentar
        - wos
        - pepita
