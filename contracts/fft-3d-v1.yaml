metadata:
  version: "1.0.0"
  author: "Sovereign AI Stack"
  description: "3D FFT and batched transforms"
  crate: "trueno-fft"
  references:
    - "Cooley & Tukey, 'An algorithm for the machine calculation of complex Fourier series', 1965"

equations:
  fft_3d:
    formula: "X[k1,k2,k3] = Σ_n1 Σ_n2 Σ_n3 x[n1,n2,n3] · exp(-2πi(k1·n1/N1 + k2·n2/N2 + k3·n3/N3))"
    domain: "x ∈ ℂ^{N1×N2×N3}, each Ni = 2^k"
    codomain: "X ∈ ℂ^{N1×N2×N3}"
    invariants:
      - "Impulse: FFT3D(δ) = 1"
      - "Roundtrip: IFFT3D(FFT3D(x)) = x within tolerance"
      - "Parseval: Σ|x|² = (1/N)·Σ|X|²"

    preconditions:
      - "!input.is_empty()"
    lean_theorem: "Theorems.Fft3d"
  fft_batched:
    formula: "For each batch b: X_b = FFT(x_b)"
    domain: "x_b ∈ ℂ^N for b = 0..B-1"
    codomain: "X_b ∈ ℂ^N"
    invariants:
      - "Each batch independently satisfies 1D FFT contract"
      - "Impulse per batch: FFT(δ) = 1"

    preconditions:
      - "!input.is_empty()"
      - "batch_size > 0"
    lean_theorem: "Theorems.FftBatched"
proof_obligations:
  - type: invariant
    property: "3D impulse response"
    formal: "FFT3D(δ_{0,0,0}) = 1 at all k"
    applies_to: all

  - type: invariant
    property: "3D roundtrip"
    formal: "||IFFT3D(FFT3D(x)) - x||_∞ < ε"
    applies_to: all

  - type: invariant
    property: "Parseval conservation"
    formal: "Σ|x|² ≈ (1/N)·Σ|X|²"
    applies_to: all

falsification_tests:
  - id: FALSIFY-3DFFT-001
    rule: "3D impulse"
    test: "test_fft_3d_impulse"
    prediction: "verified"
    if_fails: "Contract violation — implementation does not match specification"
  - id: FALSIFY-3DFFT-002
    rule: "3D roundtrip"
    test: "test_fft_3d_roundtrip"
    prediction: "verified"
    if_fails: "Contract violation — implementation does not match specification"
  - id: FALSIFY-3DFFT-003
    rule: "Parseval"
    test: "test_fft_3d_parseval"
    prediction: "verified"
    if_fails: "Contract violation — implementation does not match specification"
  - id: FALSIFY-3DFFT-004
    rule: "Batched impulse"
    test: "test_fft_batched_impulse"
    prediction: "verified"
    if_fails: "Contract violation — implementation does not match specification"
  - id: FALSIFY-3DFFT-005
    rule: "Batched roundtrip"
    test: "test_fft_batched_roundtrip"
    prediction: "verified"
    if_fails: "Contract violation — implementation does not match specification"

kani_harnesses:
  - id: KANI-FFT_3D-001
    obligation: PO-FFT_3D-001
    property: "Correctness for bounded inputs"
    bound: 8
    strategy: bounded_int
    harness: verify_fft_3d_correctness

qa_gate:
  id: QA-FFT_3D
  name: "fft-3d contract gate"
  min_coverage: 0.90
  max_complexity: 20
  required_tests: []
