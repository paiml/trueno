metadata:
  version: "1.0.0"
  author: "Sovereign AI Stack"
  description: "SVD via one-sided Jacobi rotations"
  crate: "trueno-solve"
  references:
    - "Golub & Van Loan, 'Matrix Computations', 4th ed., 2013"
    - "Batched QR and SVD on GPUs, arXiv:1707.05141"

equations:
  svd:
    formula: "A = UΣV^T where U,V orthogonal, Σ diagonal non-negative decreasing"
    domain: "A ∈ ℝ^{m×n}"
    codomain: "U ∈ ℝ^{m×m}, Σ ∈ ℝ^{min(m,n)}, V ∈ ℝ^{n×n}"
    invariants:
      - "U^T U = I, V^T V = I"
      - "σ_i ≥ σ_{i+1} ≥ 0"
      - "||A - UΣV^T||_F / ||A||_F < √min(m,n) · u"

    preconditions:
      - "!a.is_empty()"
      - "m > 0"
      - "n > 0"
    lean_theorem: "Theorems.Svd"
proof_obligations:
  - type: invariant
    property: "U orthogonality"
    formal: "||U^T U - I||_F < √m · u"
    applies_to: all

  - type: ordering
    property: "Singular values decreasing"
    formal: "σ_i ≥ σ_{i+1} for all i"
    applies_to: all

  - type: bound
    property: "Singular values non-negative"
    formal: "σ_i ≥ 0 for all i"
    applies_to: all

  - type: invariant
    property: "Reconstruction"
    formal: "||A - UΣV^T||_F / ||A||_F < √min(m,n) · u"
    applies_to: all

falsification_tests:
  - id: FALSIFY-SVD-001
    rule: "Singular values non-negative decreasing"
    test: "test_svd_singular_values_nonneg_decreasing"
    prediction: "verified"
    if_fails: "Contract violation — implementation does not match specification"
  - id: FALSIFY-SVD-002
    rule: "Reconstruction"
    test: "test_svd_reconstruction"
    prediction: "verified"
    if_fails: "Contract violation — implementation does not match specification"
  - id: FALSIFY-SVD-003
    rule: "U orthogonality"
    test: "test_svd_orthogonality_u"
    prediction: "verified"
    if_fails: "Contract violation — implementation does not match specification"
  - id: FALSIFY-SVD-004
    rule: "Singular values non-negative"
    test: "test_svd_singular_values_nonneg"
    prediction: "verified"
    if_fails: "Contract violation — implementation does not match specification"

kani_harnesses:
  - id: KANI-SOLVE_SVD-001
    obligation: PO-SOLVE_SVD-001
    property: "Correctness for bounded inputs"
    bound: 8
    strategy: bounded_int
    harness: verify_solve_svd_correctness

qa_gate:
  id: QA-SOLVE_SVD
  name: "solve-svd contract gate"
  min_coverage: 0.90
  max_complexity: 20
  required_tests: []
