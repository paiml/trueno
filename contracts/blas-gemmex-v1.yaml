contract: blas-gemmex-v1
version: 1
crate: trueno-solve
module: blas3
description: >
  Mixed-precision GEMM (gemmEx) and strided batched GEMM for cuBLAS parity.
  gemmEx: C = α·A·B + β·C with f16 inputs (u16), f32 accumulation.
  gemmStridedBatched: batch GEMM via stride offsets into flat buffers.

operations:
  - name: gemm_ex
    signature: "fn gemm_ex(a: &[u16], b: &[u16], c: &mut [f32], m, n, k, alpha, beta) -> Result<()>"
    preconditions:
      - "a.len() == m * k"
      - "b.len() == k * n"
      - "c.len() == m * n"
    postconditions:
      - "C[i,j] = alpha * sum_p(f16_to_f32(A[i,p]) * f16_to_f32(B[p,j])) + beta * C_old[i,j]"
    proof_obligations:
      - id: P1
        property: "Identity: A=I, B=X → C=X"
        test: test_gemm_ex_identity
      - id: P2
        property: "Alpha-beta scaling correctness"
        test: test_gemm_ex_alpha_beta
      - id: P3
        property: "Known matmul result (2×3 × 3×2)"
        test: test_gemm_ex_matmul_2x3_3x2
      - id: P4
        property: "f16 roundtrip accuracy within 0.01"
        test: test_f16_roundtrip

  - name: gemm_strided_batched
    signature: "fn gemm_strided_batched(a, stride_a, b, stride_b, c, stride_c, batch_count, m, n, k, alpha, beta) -> Result<()>"
    preconditions:
      - "a.len() >= (batch_count-1)*stride_a + m*k"
      - "b.len() >= (batch_count-1)*stride_b + k*n"
      - "c.len() >= (batch_count-1)*stride_c + m*n"
    postconditions:
      - "For each batch b: C_b = alpha * A_b * B_b + beta * C_b"
    proof_obligations:
      - id: P5
        property: "Single batch matches regular GEMM"
        test: test_gemm_strided_batched_single
      - id: P6
        property: "Two batches computed independently"
        test: test_gemm_strided_batched_two_batches
      - id: P7
        property: "Alpha-beta scaling per batch"
        test: test_gemm_strided_batched_alpha_beta
      - id: P8
        property: "Zero batch count is no-op"
        test: test_gemm_strided_batched_zero_batch

  - name: f32_to_f16
    signature: "fn f32_to_f16(f: f32) -> u16"
    postconditions:
      - "IEEE 754 half-precision encoding"
      - "Handles subnormals, infinity, NaN"
    proof_obligations:
      - id: P9
        property: "Buffer length mismatch rejected"
        test: test_gemm_ex_buffer_mismatch
