# QA GATE
# =============================================================================

qa_gate:
  id: "F-SOFTMAX-001"
  name: "Softmax SIMD Kernel Contract"
  checks:
    - "4-pass architecture (max, exp, sum, normalize) — NEVER fuse exp+sum"
    - "AVX2 32-wide unrolling with 4 independent accumulators for passes 1/3/4"
    - "Zero-copy output allocation (with_capacity + set_len)"
    - "Runtime dispatch with scalar fallback"
    - "Remainder handling for N % 32"
    - "Performance >= 0.95x ndarray at 32K vocabulary"
    - "All FALSIFY tests pass"
  pass_criteria: "All checks pass"

proof_obligations:
  - type: equivalence
    property: "SIMD and scalar implementations produce identical results"
    formal: "For all valid inputs: simd_softmax-kernel(x) == scalar_softmax-kernel(x)"
    proof_level: L1

falsification_tests:
  - id: F-SOFTMAX_KERNEL-001
    rule: "Correctness verified" # PO-SOFTMAX_KERNEL-001
    test: "test_softmax-kernel_simd_scalar_equivalence"
    prediction: "verified"
    if_fails: "Contract violation — implementation does not match specification"
    strategy: "Compare SIMD and scalar outputs for random inputs"

kani_harnesses:
  - id: KANI-SOFTMAX_KERNEL-001
    obligation: PO-SOFTMAX_KERNEL-001
    property: "SIMD-scalar equivalence for bounded inputs"
    bound: 8
    strategy: bounded_int
    harness: verify_softmax-kernel_equivalence

qa_gate:
  id: F-SOFTMAX_KERNEL-GATE
  name: "softmax-kernel kernel contract"
  min_coverage: 0.90
  max_complexity: 15
  required_tests:
    - "test_softmax-kernel_simd_scalar_equivalence"
