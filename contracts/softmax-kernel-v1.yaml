# Softmax SIMD Kernel Contract v1.0.0
# THE SOURCE OF TRUTH for AVX2-accelerated softmax correctness and performance
#
# STATUS: Authoritative — all slice-based softmax MUST delegate through this kernel
# CONSUMERS:
#   - src/blis/softmax.rs (softmax_1d_alloc, softmax_avx2)
#   - aprender/src/nn/functional.rs (softmax_1d delegates here)
#   - aprender/src/autograd/ops/activation.rs (Tensor::softmax delegates here)
#
# Mathematical Foundation:
#   softmax(x)_i = exp(x_i - max(x)) / Σ_j exp(x_j - max(x))
#
#   Numerically stable: subtract max before exp to prevent overflow.
#   The subtraction is mathematically invisible:
#     exp(x_i - c) / Σ_j exp(x_j - c) = exp(x_i) / Σ_j exp(x_j)  for any c
#
# Performance Analysis:
#   Softmax runs on vocabulary dimension (32K-152K) at output layer,
#   and on seq_len² in attention scores. Both are hot paths.
#
#   Bottleneck: exp() is transcendental — no SIMD vectorization without SVML.
#   Both aprender and ndarray use scalar exp(). The competitive advantage
#   comes from SIMD-accelerating the THREE other passes: max, sum, normalize.
#
# References:
#   - Milakov & Gimelshein (2018). Online normalizer calculation for softmax.
#   - Intel Intrinsics Guide: _mm256_max_ps, _mm256_add_ps, _mm256_mul_ps
#   - GH-384: softmax 0.90x vs ndarray

metadata:
  version: "1.0.0"
  created: "2026-03-02"
  author: "PAIML Engineering"
  description: "4-pass SIMD softmax with AVX2 max/sum/normalize acceleration"
  references:
    - "GH-384: softmax 0.90x vs ndarray at vocabulary sizes"
    - "Milakov & Gimelshein (2018). Online normalizer calculation for softmax"
    - "Intel Intrinsics Guide: _mm256_max_ps, _mm256_add_ps, _mm256_mul_ps"
  issues:
    - "https://github.com/paiml/aprender/issues/384"

# =============================================================================
# KERNEL EQUATIONS
# =============================================================================

equations:
  softmax:
    formula: |
      Given x ∈ R^N:
        m = max_i(x_i)                          # Pass 1: max
        e_i = exp(x_i - m)   for i = 0..N-1     # Pass 2: exp + store
        s = Σ_i e_i                              # Pass 3: sum
        y_i = e_i / s        for i = 0..N-1      # Pass 4: normalize
    domain: "x ∈ R^N, y ∈ [0,1]^N"
    properties:
      - probability: "Σ_i y_i = 1.0 (within floating-point tolerance)"
      - non_negative: "y_i ≥ 0 for all i"
      - monotonicity: "x_i > x_j → y_i > y_j"
      - shift_invariance: "softmax(x + c) = softmax(x) for any scalar c"
      - argmax_preservation: "argmax(y) = argmax(x)"
      - uniform: "softmax(k, k, ..., k) = (1/N, 1/N, ..., 1/N)"

# =============================================================================
# IMPLEMENTATION MANDATES
# =============================================================================

implementation:
  four_pass_architecture:
    description: |
      MUST use 4 separate passes. The previous 3-pass fused approach
      (exp+sum in one loop) has a loop-carried dependency on sum that
      prevents LLVM from vectorizing the surrounding code. Splitting
      allows SIMD acceleration of passes 1, 3, and 4.
    rationale: |
      ndarray's approach naturally separates passes (mapv, fold, divide).
      Fusing exp+sum saves one memory pass but loses SIMD on the sum pass.
      At vocabulary sizes (32K+), the SIMD sum pass is worth the extra
      memory traffic.
    mandates:
      - "Pass 1 (max):       SIMD horizontal reduction — MUST use AVX2 _mm256_max_ps"
      - "Pass 2 (exp+store): Scalar exp() — transcendental, no SIMD without SVML"
      - "Pass 3 (sum):       SIMD horizontal reduction — MUST use AVX2 _mm256_add_ps"
      - "Pass 4 (normalize): SIMD multiply by 1/sum — MUST use AVX2 _mm256_mul_ps"
      - "MUST NOT fuse passes 2+3 (kills SIMD opportunity on sum)"

  pass_1_max:
    description: "AVX2 horizontal max reduction with 4-way unrolling"
    mandates:
      - "Process 32 elements per iteration (4 × 8 f32 per ymm)"
      - "4 independent accumulators → reduces horizontal dependency"
      - "Final: reduce 4 accumulators → 1 via _mm256_max_ps"
      - "Horizontal 8→1 reduction: shuffle + max chain"
      - "Scalar tail for N % 32"
    pattern: |
      max0 = max1 = max2 = max3 = _mm256_set1_ps(NEG_INFINITY)
      for chunk in (0..n).step_by(32):
          max0 = max(max0, load(x[chunk]))
          max1 = max(max1, load(x[chunk+8]))
          max2 = max(max2, load(x[chunk+16]))
          max3 = max(max3, load(x[chunk+24]))
      max_val = hmax(max(max(max0, max1), max(max2, max3)))

  pass_2_exp:
    description: "Scalar exp with max subtraction, zero-copy output"
    mandates:
      - "out[i] = exp(x[i] - max_val) for all i"
      - "Output allocated with Vec::with_capacity + set_len (skip zero-fill)"
      - "Scalar loop — exp() is transcendental, no SIMD benefit without SVML"
    safety: |
      SAFETY: Vec::with_capacity(n) + set_len(n) is safe because the loop
      writes exactly n elements. Every element is initialized before return.

  pass_3_sum:
    description: "AVX2 horizontal sum reduction with 4-way unrolling"
    mandates:
      - "Process 32 elements per iteration (4 × 8 f32 per ymm)"
      - "4 independent accumulators → reduces horizontal dependency"
      - "Final: reduce 4 accumulators → 1 via _mm256_add_ps"
      - "Horizontal 8→1 reduction: hadd + shuffle chain"
      - "Scalar tail for N % 32"
    pattern: |
      sum0 = sum1 = sum2 = sum3 = _mm256_setzero_ps()
      for chunk in (0..n).step_by(32):
          sum0 = add(sum0, load(out[chunk]))
          sum1 = add(sum1, load(out[chunk+8]))
          sum2 = add(sum2, load(out[chunk+16]))
          sum3 = add(sum3, load(out[chunk+24]))
      sum_val = hsum(add(add(sum0, sum1), add(sum2, sum3)))

  pass_4_normalize:
    description: "AVX2 multiply by inv_sum with 4-way unrolling"
    mandates:
      - "inv_sum = 1.0 / sum_val (single division)"
      - "out[i] *= inv_sum via _mm256_mul_ps"
      - "32 elements per iteration (4 × 8)"
      - "In-place mutation of output buffer"
      - "Scalar tail for N % 32"

  dispatch:
    description: "Runtime CPU feature detection selects AVX2 or scalar fallback"
    assertion: "softmax_1d_alloc() checks is_x86_feature_detected!(avx2)"
    rationale: "Ensures correct execution on all x86_64 platforms"
    file: "src/blis/softmax.rs"
    function: "softmax_1d_alloc"

  scalar_fallback:
    description: "Pure Rust 4-pass implementation with same algorithmic structure"
    assertion: "Uses identical pass decomposition without intrinsics"
    rationale: "Auto-vectorizable by LLVM for passes 1/3/4; reference for testing"

  zero_copy_allocation:
    description: "Output Vec uses with_capacity + set_len to skip zero-initialization"
    assertion: "Vec::with_capacity(n) followed by set_len(n)"
    rationale: "Saves one memset(0) pass for vocabulary-sized buffers (32K+ × 4B = 128KB+)"

# =============================================================================
# PERFORMANCE BOUNDS
# =============================================================================

performance:
  benchmark_crate: "aprender-bench-compute"
  benchmark_file: "benches/softmax.rs"
  reference: "ndarray (fold + mapv + sum + div, pure Rust, no SVML)"

  bounds:
    softmax_32000:
      description: "Vocabulary softmax — LLaMA/Mistral vocab size"
      min_ratio_vs_reference: 1.40
      target_ratio: 1.50
      measured_ratio: 1.53
      measured_throughput: "477 Melem/s"
      reference_throughput: "311 Melem/s"
      measured_date: "2026-03-02"
      history:
        - { date: "2026-03-02", ratio: 0.90, note: "3-pass fused exp+sum (281 Melem/s)" }
        - { date: "2026-03-02", ratio: 1.53, note: "4-pass SIMD with AVX2 max/sum/normalize" }

    softmax_128256:
      description: "Large vocabulary softmax — Qwen2.5 vocab size"
      min_ratio_vs_reference: 1.40
      target_ratio: 1.50
      measured_ratio: 1.53
      measured_throughput: "473 Melem/s"
      reference_throughput: "310 Melem/s"
      measured_date: "2026-03-02"

    softmax_151936:
      description: "Maximum vocabulary softmax — Qwen2.5 151K vocab"
      min_ratio_vs_reference: 1.40
      target_ratio: 1.50
      measured_ratio: 1.51
      measured_throughput: "471 Melem/s"
      reference_throughput: "311 Melem/s"
      measured_date: "2026-03-02"

  analysis: |
    RESULT: 0.90x → 1.53x improvement across all vocabulary sizes.

    The 4-pass architecture outperformed expectations:
    - Expected: 5-15% gain from SIMD passes + fewer allocations
    - Measured: 53% gain (0.90x → 1.53x)

    Root cause of improvement (larger than predicted):
    1. The fused exp+sum loop had a loop-carried dependency on `sum`
       that inhibited instruction-level parallelism even for exp()
    2. Splitting into separate passes lets the CPU pipeline exp()
       computations across iterations without sum dependency
    3. AVX2 max/sum/normalize passes are 3-4x faster than auto-vec
    4. Zero-copy allocation saves one memset(0) vs vec![0.0; n]
    5. One allocation vs ndarray's two (exp result + normalized)

    Both implementations call scalar exp() per element — the gap is
    entirely from pass decomposition, SIMD reductions, and allocation.

# =============================================================================
# FALSIFICATION TESTS
# =============================================================================

falsification:
  tests_file: "src/blis/softmax.rs"
  tests_module: "blis::softmax::tests"

  FALSIFY-SM-001:
    name: "Probability distribution"
    assertion: "sum(softmax(x)) ≈ 1.0 within 1e-5 for random 32000-element input"
    test: "test_softmax_sums_to_one"
    status: "REQUIRED"

  FALSIFY-SM-002:
    name: "Non-negativity"
    assertion: "all elements ≥ 0 for input containing large negative values"
    test: "test_softmax_non_negative"
    status: "REQUIRED"

  FALSIFY-SM-003:
    name: "Monotonicity"
    assertion: "if x_i > x_j then softmax(x)_i > softmax(x)_j"
    test: "test_softmax_monotonic"
    status: "REQUIRED"

  FALSIFY-SM-004:
    name: "Shift invariance"
    assertion: "softmax(x + 1000) == softmax(x) within 1e-6"
    test: "test_softmax_shift_invariance"
    status: "REQUIRED"

  FALSIFY-SM-005:
    name: "Uniform input"
    assertion: "softmax(k, k, ..., k) = (1/N, 1/N, ..., 1/N) within 1e-6"
    test: "test_softmax_uniform"
    status: "REQUIRED"

  FALSIFY-SM-006:
    name: "AVX2 vs scalar parity"
    assertion: "AVX2 output == scalar reference (bitwise exact) for 32000 elements"
    test: "test_softmax_avx2_scalar_parity"
    status: "REQUIRED"

  FALSIFY-SM-007:
    name: "Remainder handling"
    assertion: "Correct for sizes not divisible by 32: N=1, 7, 31, 33, 127"
    test: "test_softmax_remainder_sizes"
    status: "REQUIRED"

  FALSIFY-SM-008:
    name: "Numerical stability"
    assertion: "No NaN/Inf for input with max value = 88.0 (near f32 exp overflow)"
    test: "test_softmax_numerical_stability"
    status: "REQUIRED"

  FALSIFY-SM-009:
    name: "Argmax preservation"
    assertion: "argmax(softmax(x)) == argmax(x) for random input"
    test: "test_softmax_argmax_preserved"
    status: "REQUIRED"

