# Element-wise SIMD Kernel Contract v1.0.0
# THE SOURCE OF TRUTH for AVX2-accelerated element-wise op correctness and performance
#
# STATUS: Authoritative — trueno's blis::elementwise MUST implement this contract
# CONSUMERS:
#   - src/blis/elementwise.rs (relu, add, mul_scalar + _alloc variants)
#   - aprender/src/autograd/ops/activation.rs (Tensor::relu delegates here)
#   - aprender/src/autograd/ops/mod.rs (Tensor::add, Tensor::mul_scalar delegate here)
#
# Mathematical Foundation:
#   ReLU:      y_i = max(0, x_i)
#   Add:       y_i = a_i + b_i
#   Mul scalar: y_i = x_i * s
#
# Performance Analysis:
#   These are pure memory-bandwidth-bound operations. At LLM sizes (4096+
#   elements = 16KB+), memory throughput dominates compute. SIMD helps at
#   small-to-medium sizes by reducing instruction count.
#
#   The kernel-level performance matches or exceeds ndarray. The measured
#   gap (0.86x-0.94x) at Tensor level is entirely from Tensor::from_vec
#   overhead (Arc + shape Vec allocations per operation).
#
# References:
#   - Intel Intrinsics Guide: _mm256_max_ps, _mm256_add_ps, _mm256_mul_ps
#   - GH-383: ReLU benchmark parity
#   - GH-387: element-wise ops benchmark

metadata:
  version: "1.0.0"
  created: "2026-03-02"
  author: "PAIML Engineering"
  description: "AVX2 element-wise kernels with 32-wide unrolling and zero-copy allocation"
  references:
    - "GH-383: ReLU 0.94x vs ndarray at FFN sizes"
    - "GH-387: Add 1.17x, Mul scalar 0.86x vs ndarray"
    - "Intel Intrinsics Guide: _mm256_max_ps, _mm256_add_ps, _mm256_mul_ps"
  issues:
    - "https://github.com/paiml/aprender/issues/383"
    - "https://github.com/paiml/aprender/issues/387"

# =============================================================================
# KERNEL EQUATIONS
# =============================================================================

equations:
  relu:
    formula: "y_i = max(0, x_i)"
    domain: "x ∈ R^N"
    properties:
      - idempotent: "relu(relu(x)) == relu(x)"
      - non_negative: "y_i ≥ 0 for all i"
      - identity_positive: "x_i > 0 → y_i = x_i (bitwise exact)"
      - zero_negative: "x_i ≤ 0 → y_i = 0.0"

  add:
    formula: "y_i = a_i + b_i"
    domain: "a, b ∈ R^N"
    properties:
      - commutative: "add(a, b) == add(b, a)"
      - associative: "add(add(a, b), c) == add(a, add(b, c)) (within f32 precision)"
      - identity: "add(a, 0) == a (bitwise exact)"

  mul_scalar:
    formula: "y_i = x_i * s"
    domain: "x ∈ R^N, s ∈ R"
    properties:
      - identity: "mul_scalar(x, 1.0) == x (bitwise exact)"
      - zero: "mul_scalar(x, 0.0) == 0 for all x"
      - linearity: "mul_scalar(x, a*b) == mul_scalar(mul_scalar(x, a), b) (within f32 precision)"

# =============================================================================
# IMPLEMENTATION MANDATES
# =============================================================================

implementation:
  avx2_32_wide_pattern:
    description: "All three ops use identical 32-wide unrolled AVX2 pattern"
    mandates:
      - "Process 32 elements per iteration (4 × 8 f32 per ymm register)"
      - "4 loads → 4 ops → 4 stores per iteration"
      - "8-wide cleanup loop for remainder (N mod 32)"
      - "Scalar tail for final N mod 8"
    pattern: |
      for chunk in (0..n/32):
          v0 = load(x[base])
          v1 = load(x[base+8])
          v2 = load(x[base+16])
          v3 = load(x[base+24])
          store(out[base],    op(v0))
          store(out[base+8],  op(v1))
          store(out[base+16], op(v2))
          store(out[base+24], op(v3))
    rationale: |
      4-wide unrolling provides enough independent operations to hide
      store latency and saturate the load/store ports on modern CPUs.
      Beyond 4, diminishing returns (register pressure, code size).

  relu_op:
    instruction: "_mm256_max_ps(v, zero)"
    latency: "1 cycle"
    throughput: "0.5 CPI"
    note: "Single instruction — maximum possible efficiency"

  add_op:
    instruction: "_mm256_add_ps(a, b)"
    latency: "4 cycles"
    throughput: "0.5 CPI"

  mul_scalar_op:
    instruction: "_mm256_mul_ps(v, scalar_broadcast)"
    latency: "4 cycles"
    throughput: "0.5 CPI"
    note: "scalar broadcast via _mm256_set1_ps — hoisted outside loop"

  dispatch:
    description: "Runtime CPU feature detection selects AVX2 or scalar"
    assertion: "relu/add/mul_scalar check is_x86_feature_detected!(avx2)"
    file: "src/blis/elementwise.rs"

  zero_copy_allocation:
    description: "_alloc variants skip zero-initialization of output buffer"
    mandates:
      - "relu_alloc: Vec::with_capacity(n) + set_len(n)"
      - "add_alloc: Vec::with_capacity(n) + set_len(n)"
      - "mul_scalar_alloc: Vec::with_capacity(n) + set_len(n)"
    safety: |
      SAFETY: The SIMD + scalar loops write exactly n elements.
      Every element is initialized before the Vec is returned.
    rationale: |
      At N=4096: memset(0) costs ~0.5μs. The operation itself takes ~0.24μs.
      Skipping zero-fill is a 200% speedup on allocation overhead.

# =============================================================================
# PERFORMANCE BOUNDS
# =============================================================================

performance:
  benchmark_crate: "aprender-bench-compute"
  benchmark_file: "benches/activations.rs, benches/elementwise.rs"
  reference: "ndarray (mapv, operator overloading, pure Rust)"

  # Kernel-level performance (raw slices, no Tensor overhead)
  kernel_bounds:
    relu_11008:
      description: "ReLU at FFN intermediate size — kernel only"
      expected: "parity or better vs ndarray mapv"
      note: "Single AVX2 instruction vs scalar max() — should dominate"

    add_4096:
      description: "Vector add at hidden dimension — kernel only"
      expected: "parity or better vs ndarray operator+"
      note: "Already 1.17x at Tensor level — kernel is clearly faster"

    mul_scalar_4096:
      description: "Scalar multiply at hidden dimension — kernel only"
      expected: "parity or better vs ndarray operator*"
      note: "Kernel is fast; 0.86x gap is Tensor overhead"

  # Tensor-level performance (includes Tensor::from_vec overhead)
  tensor_bounds:
    relu_tensor_11008:
      description: "ReLU through Tensor::relu() — includes autograd scaffolding"
      min_ratio_vs_reference: 0.85
      measured_ratio: 0.94
      measured_throughput: "16.3 Gelem/s"
      reference_throughput: "17.4 Gelem/s"
      measured_date: "2026-03-02"
      overhead_source: "Tensor::from_vec = Arc::new + shape.to_vec() ≈ 50-60ns"

    add_tensor_4096:
      description: "Add through Tensor::add() — already winning despite overhead"
      min_ratio_vs_reference: 1.00
      measured_ratio: 1.17
      measured_throughput: "13.9 Gelem/s"
      reference_throughput: "11.8 Gelem/s"
      measured_date: "2026-03-02"

    mul_scalar_tensor_4096:
      description: "Mul scalar through Tensor::mul_scalar()"
      min_ratio_vs_reference: 0.80
      measured_ratio: 0.86
      measured_throughput: "14.7 Gelem/s"
      reference_throughput: "17.2 Gelem/s"
      measured_date: "2026-03-02"
      overhead_source: "Tensor::from_vec = Arc::new + shape.to_vec() ≈ 50-60ns"

  overhead_analysis: |
    The gap between kernel and Tensor performance is structural:

      Tensor::from_vec(data, shape) performs:
        1. Arc::new(TensorInner { ... })  — heap allocation (~30-40ns)
        2. shape.to_vec()                 — heap allocation (~20-30ns)
        3. Total overhead: ~50-70ns per operation

      ndarray::Array1 from operator overloading:
        1. Single Vec allocation for output data
        2. Shape stored inline (no heap alloc)
        3. Total overhead: ~30ns per operation

      At N=4096 (16KB data):
        Operation time: ~240ns at 17 Gelem/s
        Tensor overhead: ~60ns → 25% penalty → expected 0.80x
        Measured: 0.86x → 14% penalty (Arc partially optimized)

      At N=11008 (44KB data):
        Operation time: ~630ns at 17 Gelem/s
        Tensor overhead: ~60ns → 9.5% penalty → expected 0.91x
        Measured: 0.94x → 6% penalty

    The overhead is fixed-cost, so larger N amortizes it better.
    Fixing this requires Tensor refactoring (SmallVec for shape,
    or arena allocation for TensorInner). Not a kernel issue.

# =============================================================================
# FALSIFICATION TESTS
# =============================================================================

falsification:
  tests_file: "src/blis/elementwise.rs"
  tests_module: "blis::elementwise::tests"

  FALSIFY-EW-001:
    name: "ReLU correctness"
    assertion: "relu([-1, 0, 1, -0.5, 2, -3, 0.1, -0.1]) == [0, 0, 1, 0, 2, 0, 0.1, 0]"
    test: "test_relu_basic"
    status: "PASS"

  FALSIFY-EW-002:
    name: "ReLU idempotence"
    assertion: "relu(relu(x)) == relu(x) for N=11008"
    test: "test_relu_large"
    status: "PASS"

  FALSIFY-EW-003:
    name: "AVX2/scalar parity (all ops)"
    assertion: "AVX2 output == scalar loop for N=1,7,8,15,16,31,32,63,64,128,4096"
    tests:
      - "test_relu_avx2_scalar_parity"
      - "test_add_avx2_scalar_parity"
      - "test_mul_scalar_avx2_scalar_parity"
    status: "PASS"

  FALSIFY-EW-004:
    name: "Add commutativity"
    assertion: "add(a, b) == add(b, a) for random 4096-element vectors"
    test: "test_add_basic"
    status: "PASS"

  FALSIFY-EW-005:
    name: "Mul scalar identity"
    assertion: "mul_scalar(x, 1.0) == x (bitwise exact)"
    test: "test_mul_scalar_basic"
    status: "PASS"

  FALSIFY-EW-006:
    name: "Size mismatch rejection"
    assertion: "relu/add/mul_scalar return Err for mismatched input/output sizes"
    tests:
      - "test_relu_error_mismatch"
      - "test_add_error_mismatch"
      - "test_mul_scalar_error_mismatch"
    status: "PASS"

