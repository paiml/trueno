# QA GATE
# =============================================================================

qa_gate:
  id: "F-ELEMENTWISE-001"
  name: "Element-wise SIMD Kernel Contract"
  checks:
    - "AVX2 32-wide unrolled pattern for all three ops"
    - "Runtime dispatch with scalar fallback"
    - "Zero-copy _alloc variants (with_capacity + set_len)"
    - "Remainder handling for N%32 and N%8"
    - "Kernel performance >= ndarray at all sizes"
    - "Tensor overhead documented and bounded"
    - "All FALSIFY tests pass"
  pass_criteria: "All checks pass"
