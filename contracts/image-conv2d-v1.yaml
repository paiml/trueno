metadata:
  version: "1.0.0"
  author: "Sovereign AI Stack"
  description: "2D image convolution and edge detection"
  crate: "trueno-image"
  references:
    - "Gonzalez & Woods, 'Digital Image Processing', 4th ed."
    - "Canny, 'A computational approach to edge detection', TPAMI 1986"

equations:
  conv2d:
    formula: "O(i,j) = Σ_p Σ_q I(i+p, j+q) · K(p, q)"
    domain: "I ∈ ℝ^{H×W}, K ∈ ℝ^{kh×kw} (kh, kw odd)"
    codomain: "O ∈ ℝ^{H×W} (same-padding)"
    invariants:
      - "Identity kernel preserves input"
      - "Separable kernel matches 2D convolution"
      - "Gaussian blur preserves constant images"

proof_obligations:
  - type: invariant
    property: "Identity kernel"
    formal: "conv2d(I, δ) = I where δ is the Kronecker delta kernel"
    tolerance: 1.0e-6
    applies_to: all

  - type: equivalence
    property: "Separable matches 2D"
    formal: "|conv2d(I, v⊗h) - separable(I, v, h)| < ε"
    tolerance: 1.0e-4
    applies_to: all

  - type: invariant
    property: "Constant image preservation under Gaussian"
    formal: "|gaussian(c, σ) - c| < ε for constant image c"
    tolerance: 1.0e-3
    applies_to: all

  - type: invariant
    property: "Canny: no edges on uniform image"
    formal: "canny(uniform) = empty edge map"
    applies_to: all

falsification_tests:
  - id: FALSIFY-IMG-001
    rule: "Separable equivalence"
    test: "test_separable_matches_2d"
  - id: FALSIFY-IMG-002
    rule: "Identity kernel"
    test: "test_identity_kernel, test_identity_kernel_larger"
  - id: FALSIFY-IMG-003
    rule: "Canny uniform"
    test: "test_canny_uniform_no_edges"
