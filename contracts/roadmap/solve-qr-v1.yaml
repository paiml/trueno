metadata:
  version: "1.0.0"
  author: "Sovereign AI Stack"
  description: "QR factorization via Householder reflections"
  crate: "trueno-solve"
  references:
    - "Golub & Van Loan, 'Matrix Computations', 4th ed., 2013"

equations:
  qr_factorization:
    formula: "A = QR where Q orthogonal (Q^T Q = I), R upper triangular"
    domain: "A ∈ ℝ^{m×n}, m ≥ n"
    codomain: "Q ∈ ℝ^{m×m}, R ∈ ℝ^{n×n}"
    invariants:
      - "Q^T Q = I (orthogonality)"
      - "||A - QR||_F / ||A||_F < √n · u"

proof_obligations:
  - type: invariant
    property: "Orthogonality"
    formal: "||Q^T Q - I||_F < √n · u"
    applies_to: all

  - type: invariant
    property: "Reconstruction"
    formal: "||A - QR||_F / ||A||_F < √n · u"
    applies_to: all

falsification_tests:
  - id: FALSIFY-QR-001
    rule: "Q orthogonality"
    test: "test_qr_orthogonality"
    prediction: "verified"
    if_fails: "Contract violation — implementation does not match specification"
  - id: FALSIFY-QR-002
    rule: "A = QR reconstruction"
    test: "test_qr_reconstruction"
    prediction: "verified"
    if_fails: "Contract violation — implementation does not match specification"

kani_harnesses:
  - id: KANI-SOLVE_QR-001
    obligation: PO-SOLVE_QR-001
    property: "Correctness for bounded inputs"
    bound: 8
    strategy: bounded_int
    harness: verify_solve_qr_correctness

qa_gate:
  id: QA-SOLVE_QR
  name: "solve-qr contract gate"
  min_coverage: 0.90
  max_complexity: 20
  required_tests: []
