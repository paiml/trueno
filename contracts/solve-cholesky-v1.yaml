metadata:
  version: "1.0.0"
  author: "Sovereign AI Stack"
  description: "Cholesky factorization for symmetric positive definite matrices"
  crate: "trueno-solve"
  references:
    - "Golub & Van Loan, 'Matrix Computations', 4th ed., Chapter 4.2"
    - "Higham, 'Accuracy and Stability of Numerical Algorithms', 2nd ed."

equations:
  cholesky:
    formula: "A = L * L^T where L is lower triangular"
    domain: "A in R^{n x n}, A symmetric positive definite"
    codomain: "L in R^{n x n} lower triangular"
    invariants:
      - "Reconstruction: ||A - L*L^T|| < n * u * ||A||"
      - "Solve accuracy: ||Ax - b|| / (||A|| * ||x||) < n * u"
      - "L is lower triangular with positive diagonal"

    preconditions:
      - "!a.is_empty()"
      - "n > 0"
      - "a.len() == n * n"
    lean_theorem: "Theorems.Cholesky"
proof_obligations:
  - type: bound
    property: "Backward error"
    formal: "||A - L*L^T||_F / ||A||_F <= n * u"
    tolerance: 0.001
    applies_to: all

  - type: invariant
    property: "Solve residual"
    formal: "||Ax - b|| / (||A|| * ||x||) < n * u"
    applies_to: all

  - type: invariant
    property: "Non-SPD rejection"
    formal: "cholesky(non_spd) returns Err"
    applies_to: all

falsification_tests:
  - id: FALSIFY-CHOL-001
    rule: "Reconstruction"
    test: "test_cholesky_spd_solve"
    prediction: "verified"
    if_fails: "Contract violation — implementation does not match specification"
  - id: FALSIFY-CHOL-002
    rule: "Non-SPD rejection"
    test: "test_cholesky_non_spd"
    prediction: "verified"
    if_fails: "Contract violation — implementation does not match specification"
  - id: FALSIFY-CHOL-003
    rule: "Backward error"
    test: "test_cholesky_residual"
    prediction: "verified"
    if_fails: "Contract violation — implementation does not match specification"

kani_harnesses:
  - id: KANI-SOLVE_CHOLESKY-001
    obligation: PO-SOLVE_CHOLESKY-001
    property: "Correctness for bounded inputs"
    bound: 8
    strategy: bounded_int
    harness: verify_solve_cholesky_correctness

qa_gate:
  id: QA-SOLVE_CHOLESKY
  name: "solve-cholesky contract gate"
  min_coverage: 0.90
  max_complexity: 20
  required_tests: []
