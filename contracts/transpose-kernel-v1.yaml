# Transpose SIMD Kernel Contract v1.0.0
# THE SOURCE OF TRUTH for AVX2 8×8 transpose correctness and performance
#
# STATUS: Authoritative — trueno's blis::transpose MUST implement this contract
# CONSUMERS:
#   - src/blis/transpose.rs (transpose, transpose_avx2)
#   - aprender/contracts/transpose-kernel-v1.yaml (upstream contract)
#   - realizar/src/contract_gate.rs (transpose_f32)
#
# Mathematical Foundation:
#   B[j * rows + i] = A[i * cols + j]   for all i,j
#
# Access Pattern Analysis (2048×128, the critical attention shape):
#   Source reads: stride 128×4=512B between rows → 8 cache lines per row
#   Dest writes: stride 2048×4=8192B between rows → different pages per row
#   Scalar 8×8 block: 64 scattered 4-byte stores → 64 cache line fetches
#   AVX2 8×8 micro-kernel: 8 contiguous 32-byte stores → 8 cache line fetches
#   Speedup from store coalescing alone: ~8x fewer cache misses
#
# References:
#   - Intel Intrinsics Guide: _mm256_unpacklo_ps, _mm256_shuffle_ps, _mm256_permute2f128_ps
#   - Lam, Rothberg & Wolf (1991). Cache Performance of Blocked Algorithms. ASPLOS

metadata:
  version: "1.0.0"
  created: "2026-03-02"
  author: "PAIML Engineering"
  description: "AVX2 8×8 in-register transpose with two-level cache blocking"
  references:
    - "GH-388: Transpose 242x slower than ndarray at attention shapes"
    - "Intel 64 and IA-32 Architectures Optimization Reference Manual, §11.12"
    - "Lam, Rothberg & Wolf (1991). Cache Performance of Blocked Algorithms. ASPLOS"
  issues:
    - "https://github.com/paiml/aprender/issues/388"

# =============================================================================
# KERNEL EQUATION
# =============================================================================

equations:
  transpose:
    formula: "B[j * rows + i] = A[i * cols + j]"
    domain: "∀i ∈ [0, rows), ∀j ∈ [0, cols)"
    properties:
      - involution: "transpose(transpose(A)) == A (bitwise exact)"
      - shape: "shape(B) == (cols, rows) where shape(A) == (rows, cols)"

# =============================================================================
# IMPLEMENTATION MANDATES
# =============================================================================

implementation:
  avx2_8x8_microkernel:
    description: "In-register 8×8 f32 transpose using AVX2 shuffle/permute"
    mandates:
      - "Load 8 source rows into 8 YMM registers (8 × _mm256_loadu_ps)"
      - "Phase 1: Interleave pairs using _mm256_unpacklo_ps / _mm256_unpackhi_ps (8 ops)"
      - "Phase 2: Shuffle 64-bit pairs using _mm256_shuffle_ps with imm8 0x44/0xEE (8 ops)"
      - "Phase 3: Swap 128-bit lanes using _mm256_permute2f128_ps with imm8 0x20/0x31 (8 ops)"
      - "Store 8 transposed rows (8 × _mm256_storeu_ps)"
      - "Total: 8 loads + 24 shuffles + 8 stores = 40 ops for 64 elements"
      - "Contiguous 32-byte stores coalesce cache misses (8 vs 64 in scalar)"
    algorithm: |
      # Phase 1: Interleave adjacent row pairs
      t0 = unpacklo(r0, r1)   # a0 b0 a1 b1 | a4 b4 a5 b5
      t1 = unpackhi(r0, r1)   # a2 b2 a3 b3 | a6 b6 a7 b7
      t2 = unpacklo(r2, r3)   # c0 d0 c1 d1 | c4 d4 c5 d5
      t3 = unpackhi(r2, r3)   # c2 d2 c3 d3 | c6 d6 c7 d7
      t4 = unpacklo(r4, r5)   # e0 f0 e1 f1 | e4 f4 e5 f5
      t5 = unpackhi(r4, r5)   # e2 f2 e3 f3 | e6 f6 e7 f7
      t6 = unpacklo(r6, r7)   # g0 h0 g1 h1 | g4 h4 g5 h5
      t7 = unpackhi(r6, r7)   # g2 h2 g3 h3 | g6 h6 g7 h7

      # Phase 2: Shuffle 64-bit pairs within 128-bit lanes
      u0 = shuffle(t0, t2, 0x44)  # a0 b0 c0 d0 | a4 b4 c4 d4
      u1 = shuffle(t0, t2, 0xEE)  # a1 b1 c1 d1 | a5 b5 c5 d5
      u2 = shuffle(t1, t3, 0x44)  # a2 b2 c2 d2 | a6 b6 c6 d6
      u3 = shuffle(t1, t3, 0xEE)  # a3 b3 c3 d3 | a7 b7 c7 d7
      u4 = shuffle(t4, t6, 0x44)  # e0 f0 g0 h0 | e4 f4 g4 h4
      u5 = shuffle(t4, t6, 0xEE)  # e1 f1 g1 h1 | e5 f5 g5 h5
      u6 = shuffle(t5, t7, 0x44)  # e2 f2 g2 h2 | e6 f6 g6 h6
      u7 = shuffle(t5, t7, 0xEE)  # e3 f3 g3 h3 | e7 f7 g7 h7

      # Phase 3: Swap 128-bit halves across YMM registers
      v0 = permute2f128(u0, u4, 0x20)  # row 0: a0 b0 c0 d0 e0 f0 g0 h0
      v1 = permute2f128(u1, u5, 0x20)  # row 1: a1 b1 c1 d1 e1 f1 g1 h1
      v2 = permute2f128(u2, u6, 0x20)  # row 2: a2 b2 c2 d2 e2 f2 g2 h2
      v3 = permute2f128(u3, u7, 0x20)  # row 3: a3 b3 c3 d3 e3 f3 g3 h3
      v4 = permute2f128(u0, u4, 0x31)  # row 4: a4 b4 c4 d4 e4 f4 g4 h4
      v5 = permute2f128(u1, u5, 0x31)  # row 5: a5 b5 c5 d5 e5 f5 g5 h5
      v6 = permute2f128(u2, u6, 0x31)  # row 6: a6 b6 c6 d6 e6 f6 g6 h6
      v7 = permute2f128(u3, u7, 0x31)  # row 7: a7 b7 c7 d7 e7 f7 g7 h7
    file: "src/blis/transpose.rs"
    function: "transpose_8x8_avx2"

  dispatch:
    description: "Runtime CPU feature detection selects AVX2 or scalar fallback"
    assertion: "transpose() checks is_x86_feature_detected!(avx2)"
    rationale: "Ensures correct execution on all x86_64 platforms"
    file: "src/blis/transpose.rs"
    function: "transpose"

  scalar_fallback:
    description: "Scalar 8×8 blocked transpose for non-AVX2 platforms"
    assertion: "transpose_region() handles arbitrary rectangular sub-blocks"
    file: "src/blis/transpose.rs"
    function: "transpose_region"

  remainder_handling:
    description: "Rows/cols not divisible by 8 handled by scalar fallback"
    mandates:
      - "Right edge: cols mod 8 != 0 → scalar transpose for remaining columns"
      - "Bottom edge: rows mod 8 != 0 → scalar transpose for remaining rows"
      - "MUST NOT skip any elements — all rows×cols elements transposed"

# =============================================================================
# PERFORMANCE BOUNDS
# =============================================================================

performance:
  benchmark_crate: "aprender-bench-compute"
  benchmark_file: "benches/transpose.rs"
  reference: "ndarray .t().to_owned() (cache-oblivious algorithm)"

  bounds:
    transpose_2048x128:
      description: "Attention K^T shape — critical for LLM decode"
      min_ratio_vs_reference: 0.40
      target_ratio: 0.70
      measured_ratio: 0.55
      measured_throughput: "3.71 Gelem/s"
      reference_throughput: "6.77 Gelem/s"
      measured_date: "2026-03-02"
      history:
        - { date: "2026-03-02", ratio: 0.068, note: "Scalar 8×8 tiling (459 Melem/s)" }
        - { date: "2026-03-02", ratio: 0.35, note: "AVX2 8×8 micro-kernel" }
        - { date: "2026-03-02", ratio: 0.55, note: "Shape-adaptive loop order (tall-skinny path)" }
      note: |
        ndarray .t().to_owned() flips strides and does memcpy — NOT a real transpose.
        This is a structural benchmark gap: memcpy vs actual data rearrangement.
        0.55x against memcpy is a genuine win for the kernel.

    transpose_4096x4096:
      description: "Square transpose — TLB-limited regime"
      min_ratio_vs_reference: 0.80
      target_ratio: 1.00
      measured_ratio: 0.88
      measured_throughput: "486 Melem/s"
      reference_throughput: "550 Melem/s"
      measured_date: "2026-03-02"
      history:
        - { date: "2026-03-02", ratio: 0.48, note: "Scalar 8×8 tiling (241 Melem/s)" }
        - { date: "2026-03-02", ratio: 0.88, note: "AVX2 + two-level tiling" }

  analysis: |
    Post-SIMD with shape-adaptive loop order:

    2048×128 (tall-skinny):
      - Shape-adaptive loop order: inner loop over r0 makes destination
        writes sequential (B[c0*rows+r0], B[c0*rows+r0+8] are adjacent)
      - Software prefetch for next micro-kernel's destination
      - Improved from 0.35x → 0.55x
      - Remaining gap: ndarray's "transpose" is actually memcpy (stride flip),
        not real data rearrangement. This is a structural benchmark asymmetry.

    4096×4096 (square):
      - Two-level tiling: 64×64 outer (L1), 8×8 inner (AVX2)
      - TLB-limited: 4096×4096×4 = 64MB, each 8×8 block touches different TLB entry
      - Prefetch on square path could improve by reducing TLB misses

# =============================================================================
# FALSIFICATION TESTS
# =============================================================================

falsification:
  tests_file: "src/blis/transpose.rs"

  FALSIFY-TP-001:
    name: "Correctness: small matrix"
    assertion: "3×4 transpose matches hand-computed result (bitwise exact)"
    status: "REQUIRED"

  FALSIFY-TP-002:
    name: "Involution"
    assertion: "transpose(transpose(A)) == A for random 64×64"
    status: "REQUIRED"

  FALSIFY-TP-003:
    name: "Non-8-aligned dimensions"
    assertion: "Correct for 7×13, 17×3, 1×N, N×1"
    status: "REQUIRED"

  FALSIFY-TP-004:
    name: "AVX2 vs scalar parity"
    assertion: "AVX2 output == scalar output for 2048×128 (bitwise exact)"
    status: "REQUIRED"

  FALSIFY-TP-005:
    name: "Attention shape"
    assertion: "2048×128 transpose correct (LLM decode critical path)"
    status: "REQUIRED"

# =============================================================================
# QA GATE
# =============================================================================

qa_gate:
  id: "F-TRANSPOSE-001"
  name: "Transpose SIMD Kernel Contract"
  checks:
    - "AVX2 8×8 micro-kernel uses 3-phase shuffle/permute pattern"
    - "Runtime dispatch with scalar fallback"
    - "Remainder rows/cols handled correctly"
    - "All FALSIFY tests pass"
    - "Performance >= min_ratio for all bounds"
  pass_criteria: "All checks pass"

proof_obligations:
  - type: equivalence
    property: "SIMD and scalar implementations produce identical results"
    formal: "For all valid inputs: simd_transpose-kernel(x) == scalar_transpose-kernel(x)"
    proof_level: L1

falsification_tests:
  - id: F-TRANSPOSE_KERNEL-001
    rule: "Correctness verified" # PO-TRANSPOSE_KERNEL-001
    test: "test_transpose-kernel_simd_scalar_equivalence"
    prediction: "verified"
    if_fails: "Contract violation — implementation does not match specification"
    strategy: "Compare SIMD and scalar outputs for random inputs"

kani_harnesses:
  - id: KANI-TRANSPOSE_KERNEL-001
    obligation: PO-TRANSPOSE_KERNEL-001
    property: "SIMD-scalar equivalence for bounded inputs"
    bound: 8
    strategy: bounded_int
    harness: verify_transpose-kernel_equivalence

qa_gate:
  id: F-TRANSPOSE_KERNEL-GATE
  name: "transpose-kernel kernel contract"
  min_coverage: 0.90
  max_complexity: 15
  required_tests:
    - "test_transpose-kernel_simd_scalar_equivalence"
