metadata:
  version: "1.0.0"
  author: "Sovereign AI Stack"
  description: "Sparse General Matrix-Matrix Multiply (SpGEMM)"
  crate: "trueno-sparse"
  references:
    - "Gustavson, 'Two fast algorithms for sparse matrices', 1978"

equations:
  spgemm:
    formula: "C = A * B where A, B, C are sparse CSR"
    domain: "A ∈ CSR^{m×k}, B ∈ CSR^{k×n}"
    codomain: "C ∈ CSR^{m×n}"
    invariants:
      - "Identity: AI = A, IA = A"
      - "Associativity: (AB)C = A(BC) within tolerance"
      - "Dimension: C.rows = A.rows, C.cols = B.cols"
      - "Diagonal: diag(a) * diag(b) = diag(a.*b)"

proof_obligations:
  - type: invariant
    property: "Right identity"
    formal: "spgemm(A, I) = A"
    applies_to: all

  - type: invariant
    property: "Left identity"
    formal: "spgemm(I, A) = A"
    applies_to: all

  - type: invariant
    property: "Known product"
    formal: "spgemm(A, B).to_dense() = dense(A) * dense(B)"
    applies_to: small_matrices

falsification_tests:
  - id: FALSIFY-SPGEMM-001
    rule: "Right identity"
    test: "test_spgemm_identity"
  - id: FALSIFY-SPGEMM-002
    rule: "Left identity"
    test: "test_spgemm_identity_left"
  - id: FALSIFY-SPGEMM-003
    rule: "Known product"
    test: "test_spgemm_known_product"
  - id: FALSIFY-SPGEMM-004
    rule: "Dimension mismatch"
    test: "test_spgemm_dimension_mismatch"
  - id: FALSIFY-SPGEMM-005
    rule: "Diagonal product"
    test: "test_spgemm_sparse_result"
