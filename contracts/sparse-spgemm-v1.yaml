metadata:
  version: "1.0.0"
  author: "Sovereign AI Stack"
  description: "Sparse General Matrix-Matrix Multiply (SpGEMM)"
  crate: "trueno-sparse"
  references:
    - "Gustavson, 'Two fast algorithms for sparse matrices', 1978"

equations:
  spgemm:
    formula: "C = A * B where A, B, C are sparse CSR"
    domain: "A ∈ CSR^{m×k}, B ∈ CSR^{k×n}"
    codomain: "C ∈ CSR^{m×n}"
    invariants:
      - "Identity: AI = A, IA = A"
      - "Associativity: (AB)C = A(BC) within tolerance"
      - "Dimension: C.rows = A.rows, C.cols = B.cols"
      - "Diagonal: diag(a) * diag(b) = diag(a.*b)"

    preconditions:
      - "!a_values.is_empty()"
      - "!b_values.is_empty()"
    lean_theorem: "Theorems.Spgemm"
proof_obligations:
  - type: invariant
    property: "Right identity"
    formal: "spgemm(A, I) = A"
    applies_to: all

  - type: invariant
    property: "Left identity"
    formal: "spgemm(I, A) = A"
    applies_to: all

  - type: invariant
    property: "Known product"
    formal: "spgemm(A, B).to_dense() = dense(A) * dense(B)"
    applies_to: small_matrices

falsification_tests:
  - id: FALSIFY-SPGEMM-001
    rule: "Right identity"
    test: "test_spgemm_identity"
    prediction: "verified"
    if_fails: "Contract violation — implementation does not match specification"
  - id: FALSIFY-SPGEMM-002
    rule: "Left identity"
    test: "test_spgemm_identity_left"
    prediction: "verified"
    if_fails: "Contract violation — implementation does not match specification"
  - id: FALSIFY-SPGEMM-003
    rule: "Known product"
    test: "test_spgemm_known_product"
    prediction: "verified"
    if_fails: "Contract violation — implementation does not match specification"
  - id: FALSIFY-SPGEMM-004
    rule: "Dimension mismatch"
    test: "test_spgemm_dimension_mismatch"
    prediction: "verified"
    if_fails: "Contract violation — implementation does not match specification"
  - id: FALSIFY-SPGEMM-005
    rule: "Diagonal product"
    test: "test_spgemm_sparse_result"
    prediction: "verified"
    if_fails: "Contract violation — implementation does not match specification"

kani_harnesses:
  - id: KANI-SPARSE_SPGEMM-001
    obligation: PO-SPARSE_SPGEMM-001
    property: "Correctness for bounded inputs"
    bound: 8
    strategy: bounded_int
    harness: verify_sparse_spgemm_correctness

qa_gate:
  id: QA-SPARSE_SPGEMM
  name: "sparse-spgemm contract gate"
  min_coverage: 0.90
  max_complexity: 20
  required_tests: []
