metadata:
  version: "1.0.0"
  author: "Sovereign AI Stack"
  description: "BLAS Level-3 operations: syrk, trmm, symm"
  crate: "trueno-solve"
  references:
    - "Dongarra et al., 'A set of level 3 basic linear algebra subprograms', 1990"

equations:
  syrk:
    formula: "C = α·A·Aᵀ + β·C"
    domain: "A ∈ ℝ^{n×k}, C ∈ ℝ^{n×n} (symmetric)"
    invariants:
      - "Output is symmetric: C = Cᵀ"
      - "Identity: syrk(I, n, n, α, β) = α·I + β·C"

    preconditions:
      - "!a.is_empty()"
    lean_theorem: "Theorems.Syrk"
  trmm:
    formula: "B = α·A·B where A is lower triangular"
    domain: "A ∈ ℝ^{n×n} (triangular), B ∈ ℝ^{n×m}"
    invariants:
      - "Identity: trmm(I, B) = α·B"

    preconditions:
      - "!a.is_empty()"
      - "!b.is_empty()"
    lean_theorem: "Theorems.Trmm"
  symm:
    formula: "C = α·A·B + β·C where A is symmetric"
    domain: "A ∈ ℝ^{n×n} (symmetric), B ∈ ℝ^{n×m}"
    invariants:
      - "Identity: symm(I, B, C, α, β) = α·B + β·C"
      - "Equivalent to GEMM when A is stored full"

    preconditions:
      - "!a.is_empty()"
      - "!b.is_empty()"
    lean_theorem: "Theorems.Symm"
proof_obligations:
  - type: invariant
    property: "syrk symmetry"
    formal: "C[i,j] = C[j,i] after syrk"
    applies_to: all

  - type: invariant
    property: "trmm identity"
    formal: "trmm(I, B, α) = α·B"
    applies_to: all

falsification_tests:
  - id: FALSIFY-BLAS3-001
    rule: "syrk identity"
    test: "test_syrk_identity"
    prediction: "verified"
    if_fails: "Contract violation — implementation does not match specification"
  - id: FALSIFY-BLAS3-002
    rule: "syrk known value"
    test: "test_syrk_known_value"
    prediction: "verified"
    if_fails: "Contract violation — implementation does not match specification"
  - id: FALSIFY-BLAS3-003
    rule: "syrk symmetry"
    test: "test_syrk_symmetry"
    prediction: "verified"
    if_fails: "Contract violation — implementation does not match specification"
  - id: FALSIFY-BLAS3-004
    rule: "trmm identity"
    test: "test_trmm_identity"
    prediction: "verified"
    if_fails: "Contract violation — implementation does not match specification"
  - id: FALSIFY-BLAS3-005
    rule: "trmm triangular"
    test: "test_trmm_lower_triangular"
    prediction: "verified"
    if_fails: "Contract violation — implementation does not match specification"
  - id: FALSIFY-BLAS3-006
    rule: "symm known product"
    test: "test_symm_known_product"
    prediction: "verified"
    if_fails: "Contract violation — implementation does not match specification"

kani_harnesses:
  - id: KANI-BLAS_LEVEL3-001
    obligation: PO-BLAS_LEVEL3-001
    property: "Correctness for bounded inputs"
    bound: 8
    strategy: bounded_int
    harness: verify_blas_level3_correctness

qa_gate:
  id: QA-BLAS_LEVEL3
  name: "blas-level3 contract gate"
  min_coverage: 0.90
  max_complexity: 20
  required_tests: []
