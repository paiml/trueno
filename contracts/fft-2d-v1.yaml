metadata:
  version: "1.0.0"
  author: "Sovereign AI Stack"
  description: "2D FFT via row-column decomposition"
  crate: "trueno-fft"
  references:
    - "Cooley & Tukey, 'An algorithm for the machine calculation of complex Fourier series', 1965"

equations:
  fft_2d:
    formula: "X[k1,k2] = sum_{n1,n2} x[n1,n2] * exp(-2*pi*i*(k1*n1/N1 + k2*n2/N2))"
    domain: "x in C^{N1 x N2}, N1,N2 powers of two"
    codomain: "X in C^{N1 x N2}"
    invariants:
      - "2D Parseval: sum|x|^2 = (1/(N1*N2)) * sum|X|^2"
      - "Separability: 2D FFT = FFT_rows then FFT_cols"
      - "Impulse: FFT_2D(delta) = 1 everywhere"

proof_obligations:
  - type: invariant
    property: "2D impulse response"
    formal: "fft_2d(delta)[k1,k2] = 1 for all k1,k2"
    applies_to: all

  - type: invariant
    property: "Parseval energy conservation"
    formal: "sum|x|^2 = (1/N) * sum|X|^2"
    tolerance: 1.0e-3
    applies_to: all

falsification_tests:
  - id: FALSIFY-FFT2D-001
    rule: "2D impulse"
    test: "test_fft_2d_impulse"
  - id: FALSIFY-FFT2D-002
    rule: "Parseval"
    test: "prop_parseval_conservation"
