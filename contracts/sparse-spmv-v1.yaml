metadata:
  version: "1.0.0"
  author: "Sovereign AI Stack"
  description: "Sparse Matrix-Vector Multiply (CSR format)"
  crate: "trueno-sparse"
  references:
    - "Merrill & Garland, 'Merge-Based Parallel Sparse Matrix-Vector Multiplication', PPoPP 2016"
    - "LAProof: Princeton formal verification of SpMV in C (Appel et al.)"

equations:
  spmv:
    formula: "y_i = alpha * sum_j(A_ij * x_j) + beta * y_i"
    domain: "A in CSR^{m x n}, x in R^n, y in R^m, alpha,beta in R"
    codomain: "y in R^m"
    invariants:
      - "Output length equals number of rows: len(y) == m"
      - "Backward error bounded: |Ay - y_exact| <= nnz_per_row * u * |A| * |x|"
      - "SpMV is linear in x"

proof_obligations:
  - type: invariant
    property: "Output dimension correctness"
    formal: "len(result) == A.rows()"
    applies_to: all

  - type: equivalence
    property: "Sparse result matches dense reference"
    formal: "|sparse_spmv(A,x) - dense_matvec(A.to_dense(), x)| < epsilon"
    tolerance: 1.0e-5
    applies_to: all

  - type: bound
    property: "Backward error bound (LAProof)"
    formal: "||Ax_computed - Ax_exact||_inf <= n * u * ||A||_inf * ||x||_inf"
    tolerance: "n * f32::EPSILON"
    applies_to: all

  - type: linearity
    property: "SpMV is linear in x"
    formal: "|spmv(A, alpha*x + beta*y) - alpha*spmv(A,x) - beta*spmv(A,y)| < epsilon"
    tolerance: 1.0e-4
    applies_to: all

falsification_tests:
  - id: FALSIFY-SPARSE-001
    rule: "Dense equivalence"
    test: "test_spmv_known_result"
  - id: FALSIFY-SPARSE-002
    rule: "Dimension mismatch"
    test: "test_spmv_dimension_mismatch"
  - id: FALSIFY-SPARSE-003
    rule: "Alpha-beta scaling"
    test: "test_spmv_alpha_beta"
  - id: FALSIFY-SPARSE-004
    rule: "Backward error bound"
    test: "prop_spmv_backward_error"
