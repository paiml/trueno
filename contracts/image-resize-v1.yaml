metadata:
  version: "1.0.0"
  author: "Sovereign AI Stack"
  description: "Image resize with nearest, bilinear, bicubic, and Lanczos interpolation"
  crate: "trueno-image"
  references:
    - "Keys, 'Cubic Convolution Interpolation for Digital Image Processing', IEEE TASSP, 1981"
    - "Turkowski, 'Filters for Common Resampling Tasks', Graphics Gems I, 1990"

equations:
  resize:
    formula: "O(dx,dy) = interp(I, sx(dx), sy(dy))"
    domain: "I in R^{W_src x H_src}, method in {Nearest, Bilinear, Bicubic, Lanczos}"
    codomain: "O in R^{W_dst x H_dst}"
    invariants:
      - "Same-size resize preserves image"
      - "Constant image stays constant under any interpolation"
      - "Output dimensions match requested size"

proof_obligations:
  - type: invariant
    property: "Identity resize"
    formal: "resize(I, W, H, W, H, method) = I"
    applies_to: all

  - type: invariant
    property: "Constant preservation"
    formal: "resize(constant_c, W1, H1, W2, H2, method) = constant_c"
    tolerance: 0.01
    applies_to: all

  - type: invariant
    property: "Zero output dimension rejected"
    formal: "resize(I, W, H, 0, H2) returns Err"
    applies_to: all

falsification_tests:
  - id: FALSIFY-RESIZE-001
    rule: "Nearest identity"
    test: "test_resize_nearest_identity"
  - id: FALSIFY-RESIZE-002
    rule: "Bilinear identity"
    test: "test_resize_bilinear_identity"
  - id: FALSIFY-RESIZE-003
    rule: "Bicubic constant"
    test: "test_resize_bicubic_constant"
  - id: FALSIFY-RESIZE-004
    rule: "Lanczos constant"
    test: "test_resize_lanczos_constant"
  - id: FALSIFY-RESIZE-005
    rule: "Zero dimension"
    test: "test_resize_zero_output"
