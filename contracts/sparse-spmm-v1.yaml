metadata:
  version: "1.0.0"
  author: "Sovereign AI Stack"
  description: "Sparse Matrix-Matrix Multiply (CSR format)"
  crate: "trueno-sparse"
  references:
    - "Gustavson, 'Two fast algorithms for sparse matrices', 1978"

equations:
  spmm:
    formula: "C = alpha * A * B + beta * C where A is sparse CSR, B,C are dense"
    domain: "A in CSR^{m x k}, B in R^{k x n}, C in R^{m x n}"
    codomain: "C in R^{m x n}"
    invariants:
      - "Output dimensions: C.rows = A.rows, C.cols = B.cols"
      - "Matches dense reference within backward error"

    preconditions:
      - "!values.is_empty()"
      - "b_cols > 0"
    lean_theorem: "Theorems.Spmm"
proof_obligations:
  - type: equivalence
    property: "Sparse-dense result matches dense-dense reference"
    formal: "|spmm(A,B) - dense(A)*B| < epsilon"
    tolerance: 1.0e-4
    applies_to: all

  - type: invariant
    property: "Identity matrix: I*B = B"
    formal: "spmm(I, B) = B"
    applies_to: all

falsification_tests:
  - id: FALSIFY-SPMM-001
    rule: "Dense equivalence"
    test: "test_spmm_matches_dense"
    prediction: "verified"
    if_fails: "Contract violation — implementation does not match specification"
  - id: FALSIFY-SPMM-002
    rule: "Dimension mismatch"
    test: "test_spmm_dimension_mismatch"
    prediction: "verified"
    if_fails: "Contract violation — implementation does not match specification"

kani_harnesses:
  - id: KANI-SPARSE_SPMM-001
    obligation: PO-SPARSE_SPMM-001
    property: "Correctness for bounded inputs"
    bound: 8
    strategy: bounded_int
    harness: verify_sparse_spmm_correctness

qa_gate:
  id: QA-SPARSE_SPMM
  name: "sparse-spmm contract gate"
  min_coverage: 0.90
  max_complexity: 20
  required_tests: []
