metadata:
  version: "1.0.0"
  author: "Sovereign AI Stack"
  description: "Block Sparse Row (BSR) format — cuSPARSE parity"
  crate: "trueno-sparse"
  references:
    - "cuSPARSE documentation, NVIDIA"
    - "Saad, 'Iterative Methods for Sparse Linear Systems', 2003"

equations:
  bsr_spmv:
    formula: "y = α · A_BSR · x + β · y"
    domain: "A_BSR block-structured, x ∈ ℝ^n, y ∈ ℝ^m"
    codomain: "y ∈ ℝ^m"
    invariants:
      - "BSR SpMV matches CSR SpMV for same matrix"
      - "Identity block matrix: y = α·x + β·y"

    preconditions:
      - "!values.is_empty()"
      - "block_size > 0"
    lean_theorem: "Theorems.BsrSpmv"
proof_obligations:
  - type: invariant
    property: "BSR-CSR SpMV equivalence"
    formal: "||y_BSR - y_CSR||_inf < ε"
    applies_to: all

  - type: invariant
    property: "Alpha-beta scaling"
    formal: "spmv(α,x,β,y) = α·A·x + β·y"
    applies_to: all

falsification_tests:
  - id: FALSIFY-BSR-001
    rule: "BSR-CSR equivalence"
    test: "test_bsr_to_csr_roundtrip"
    prediction: "verified"
    if_fails: "Contract violation — implementation does not match specification"
  - id: FALSIFY-BSR-002
    rule: "Alpha-beta scaling"
    test: "test_bsr_alpha_beta"
    prediction: "verified"
    if_fails: "Contract violation — implementation does not match specification"

kani_harnesses:
  - id: KANI-SPARSE_BSR-001
    obligation: PO-SPARSE_BSR-001
    property: "Correctness for bounded inputs"
    bound: 8
    strategy: bounded_int
    harness: verify_sparse_bsr_correctness

qa_gate:
  id: QA-SPARSE_BSR
  name: "sparse-bsr contract gate"
  min_coverage: 0.90
  max_complexity: 20
  required_tests: []
