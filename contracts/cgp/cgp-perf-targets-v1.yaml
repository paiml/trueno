# Performance targets contract — shipping blockers (updated 2026-04-05)
# Target: competitive with best pure-Rust and C BLAS implementations
kind: PerformanceContract
name: cgp-perf-targets
version: "2.0.0"
kernel: all_operations

bounds:
  # CPU GEMM 1024 1T vs NumPy/OpenBLAS (measured 2026-04-05)
  - operation: cpu_gemm_1024_1t
    competitor: numpy_openblas
    trueno_gflops: 137
    competitor_gflops: 132
    ratio: 1.04
    status: PASS
    note: "Both at AVX-512 hardware peak. trueno 8x32 microkernel."

  # CPU GEMM 1024 1T vs faer (criterion, 2026-04-05 post SIMD B-packing)
  - operation: cpu_gemm_1024_1t
    competitor: faer_024
    trueno_ms: 15.39
    trueno_gflops: 140
    competitor_ms: 15.11
    competitor_gflops: 142
    ratio: 0.98
    status: PASS
    note: "2% gap (was 12%). SIMD B-packing closed most of the delta."

  # CPU GEMM 1024 1T vs ndarray (criterion, 2026-04-05 post SIMD B-packing)
  - operation: cpu_gemm_1024_1t
    competitor: ndarray_017
    trueno_ms: 15.39
    competitor_ms: 18.01
    ratio: 1.17
    status: PASS

  # CPU GEMM 1024 parallel vs NumPy/OpenBLAS (measured 2026-04-05)
  # Updated 2026-04-05: 8T cap (was phys/2=12T). 8T peak due to CCD L3 fit.
  - operation: cpu_gemm_1024_parallel
    competitor: numpy_openblas
    trueno_gflops: 626
    trueno_threads: 8
    competitor_gflops: 687
    ratio: 0.91
    status: KNOWN_GAP
    note: "8T peak (626 GFLOPS). 12T regresses to 559 due to cross-CCD L3 thrashing."

  # Q4K GEMV composite tokens/sec (measured 2026-04-05)
  - operation: q4k_gemv_composite
    min_tok_per_sec: 10.0
    measured_tok_per_sec: 14.6
    status: PASS
    note: "Llama-7B-like, 192 GEMVs/token, 4 layer sizes averaged."

  # GPU FP32 GEMM — not expected to beat cuBLAS
  - operation: gpu_gemm_fp32
    competitor: cublas
    cublas_tflops: 43.9
    trueno_ptx_tflops: 11.6
    ratio: 0.26
    goal_ratio: 0.50
    status: KNOWN_GAP

  # Empirical roofline — single-core AVX-512 (measured 2026-04-05)
  - operation: empirical_roofline_avx512
    measured_peak_gflops: 152.5
    theoretical_peak_gflops: 224
    efficiency_pct: 68
    measured_bandwidth_gbps: 20.4
    status: REFERENCE

falsification:
  - name: FALSIFY-CGP-090
    description: "CPU GEMM must achieve > 100 GFLOPS parallel at 1024"
    check: "gemm_1024_parallel_gflops > 100"
  - name: FALSIFY-CGP-091
    description: "CPU GEMM must be >= 0.9x ndarray at 1024 1T"
    check: "gemm_1024_1t_ratio_vs_ndarray >= 0.9"
  - name: FALSIFY-CGP-092
    description: "Q4K composite tokens/sec >= 10"
    check: "q4k_composite_tok_per_sec >= 10"
