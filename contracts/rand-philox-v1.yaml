metadata:
  version: "1.0.0"
  author: "Sovereign AI Stack"
  description: "Philox 4x32-10 counter-based RNG"
  crate: "trueno-rand"
  references:
    - "Salmon et al., 'Parallel random numbers: as easy as 1, 2, 3', SC 2011"

equations:
  philox:
    formula: "output = Philox4x32_10(counter, key) — 10 rounds of Feistel-like bijection"
    domain: "counter ∈ {0..2^128}, key ∈ {0..2^64}"
    codomain: "output ∈ {0..2^32}^4"
    invariants:
      - "Determinism: same (key, counter) → same output"
      - "Period: 2^128 per key"
      - "Statistical quality: passes BigCrush"

    preconditions:
      - "rounds >= 1"
    lean_theorem: "Theorems.Philox"
proof_obligations:
  - type: determinism
    property: "Reproducibility"
    formal: "Philox(key, ctr) == Philox(key, ctr) for all inputs"
    applies_to: all

  - type: bound
    property: "Uniform distribution"
    formal: "chi-squared test on 100-bucket histogram < 150 (p=0.001)"
    applies_to: all

  - type: bound
    property: "Normal distribution (Box-Muller)"
    formal: "|mean| < 0.02, |variance - 1.0| < 0.05 for 100k samples"
    applies_to: all

falsification_tests:
  - id: FALSIFY-RNG-001
    rule: "Determinism"
    test: "test_deterministic_same_seed"
    prediction: "verified"
    if_fails: "Contract violation — implementation does not match specification"
  - id: FALSIFY-RNG-002
    rule: "Uniform chi-squared"
    test: "test_chi_squared_uniformity"
    prediction: "verified"
    if_fails: "Contract violation — implementation does not match specification"
  - id: FALSIFY-RNG-003
    rule: "Normal distribution"
    test: "test_normal_mean_and_variance"
    prediction: "verified"
    if_fails: "Contract violation — implementation does not match specification"

kani_harnesses:
  - id: KANI-RAND_PHILOX-001
    obligation: PO-RAND_PHILOX-001
    property: "Correctness for bounded inputs"
    bound: 8
    strategy: bounded_int
    harness: verify_rand_philox_correctness

qa_gate:
  id: QA-RAND_PHILOX
  name: "rand-philox contract gate"
  min_coverage: 0.90
  max_complexity: 20
  required_tests: []
